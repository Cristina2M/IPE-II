<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Espacial - Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .contact-form input,
        .contact-form textarea {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem;
            border-radius: 8px;
            color: white;
            font-family: var(--font-main);
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>

<body>
    <div class="stars"></div>
    <div class="twinkling"></div>

    <header>
        <div class="logo">
            <img src="img/LOGOS/1-pica-removebg-preview-pica.png" alt="Genio Academy Logo">
            GENIO ACADEMY
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="quienes-somos.html">Quiénes Somos</a></li>
                <li><a href="suscripciones.html">Planes</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="glass-card hero-content">
            <h1>Contacta con la Base</h1>
            <p>¿Listo para despegar? Envíanos un mensaje.</p>

            <form class="contact-form">
                <input type="text" placeholder="Nombre de Cadete" required>
                <input type="email" placeholder="Correo Electrónico" required>
                <textarea rows="5" placeholder="Mensaje de intercepción..." required></textarea>
                <button type="submit" class="cta-button">Enviar Transmisión</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Genio Academy. Todos los derechos reservados.</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
